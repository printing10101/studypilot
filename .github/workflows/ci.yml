name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 全历史扫描
      - uses: gitleaks/setup-gitleaks@v2
      # 直接用 CLI 扫全量历史：gitleaks-action 按 push 的 before/after SHA 增量扫描，
      # force-push/历史重写后旧 SHA 不存在会导致其内部 git log 报错退出
      - run: gitleaks detect --source . --verbose --redact

  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          working-directory: backend
      - run: ruff check .
        working-directory: backend
      # pytest 需要完整安装依赖（含 torch，体积大耗时长），作为本地提交前门禁，
      # 运行方式见 README「测试」一节。

  frontend-lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm lint
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend
